<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Runtime threads and queues of the edge process"><title>Runtime threads and queues of the edge process</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#1a1a19"/><text x="28" y="34" font-size="16" font-weight="600" fill="#f0efec" text-anchor="start">One process, five kinds of thread: frames never wait for Re-ID or the database</text><rect x="28" y="90" width="184" height="108" rx="8" fill="#242422" stroke="#4a4a46" stroke-width="1"/><rect x="28" y="100" width="4" height="88" rx="2" fill="#3987e5"/><text x="44" y="116" font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">camera threads ×N</text><text x="44" y="136" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">decode (FFmpeg, 1 thread</text><text x="44" y="153" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">each) into a newest-</text><text x="44" y="170" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">frame slot per camera</text><rect x="268" y="90" width="184" height="108" rx="8" fill="#242422" stroke="#4a4a46" stroke-width="1"/><rect x="268" y="100" width="4" height="88" rx="2" fill="#3987e5"/><text x="284" y="116" font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">perception thread</text><text x="284" y="136" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">batch → pre-process →</text><text x="284" y="153" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">GPU inference (FP16) →</text><text x="284" y="170" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">post-process → tracking</text><rect x="508" y="90" width="184" height="108" rx="8" fill="#242422" stroke="#4a4a46" stroke-width="1"/><rect x="508" y="100" width="4" height="88" rx="2" fill="#d95926"/><text x="524" y="116" font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">reid thread</text><text x="524" y="136" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">crops → embeddings →</text><text x="524" y="153" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">global identity manager;</text><text x="524" y="170" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">drops oldest when behind</text><rect x="748" y="90" width="184" height="108" rx="8" fill="#242422" stroke="#4a4a46" stroke-width="1"/><rect x="748" y="100" width="4" height="88" rx="2" fill="#d95926"/><text x="764" y="116" font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">store-writer thread</text><text x="764" y="136" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">batched SQLite writes</text><text x="764" y="153" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">(enqueue costs 2.2 µs</text><text x="764" y="170" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">on the video path)</text><rect x="988" y="90" width="184" height="108" rx="8" fill="#242422" stroke="#4a4a46" stroke-width="1"/><rect x="988" y="100" width="4" height="88" rx="2" fill="#199e70"/><text x="1004" y="116" font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">API server</text><text x="1004" y="136" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">FastAPI / uvicorn:</text><text x="1004" y="153" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">REST, SSE events,</text><text x="1004" y="170" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">live JPEG frames</text><line x1="212" y1="144.0" x2="264" y2="144.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="240" y="135.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">slots</text><line x1="452" y1="144.0" x2="504" y2="144.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="480" y="135.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">queue</text><line x1="692" y1="144.0" x2="744" y2="144.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="720" y="135.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">queue</text><line x1="932" y1="144.0" x2="984" y2="144.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="960" y="135.0" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">reads</text><path d="M360.0,198 V238 H1080.0 V202" fill="none" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="720.0" y="232" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">live frames and tracks (live hub)</text><text x="28" y="300" font-size="11" font-weight="600" fill="#898781" text-anchor="start">MEASURED AT SATURATION, 8 CAMERAS, EVERY FRAME (MILESTONE 9)</text><circle cx="36" cy="326" r="3" fill="#c3c2b7"/><text x="48" y="330" font-size="13" font-weight="400" fill="#f0efec" text-anchor="start">CPU per thread: camera readers 1.7 cores, perception 0.77, Re-ID 0.69; the perception thread never waits for frames.</text><circle cx="36" cy="356" r="3" fill="#c3c2b7"/><text x="48" y="360" font-size="13" font-weight="400" fill="#f0efec" text-anchor="start">Perception thread time: pre-process 14 %, GPU inference 37 %, post-process 21 %, tracking 25 %: the GPU idles during the CPU steps.</text><circle cx="36" cy="386" r="3" fill="#c3c2b7"/><text x="48" y="390" font-size="13" font-weight="400" fill="#f0efec" text-anchor="start">One process: 84.7 frames/s, GPU 43 % busy. Two processes (4 cameras each), same conditions: 110.5 frames/s, GPU 77 % busy.</text><text x="28" y="452" font-size="12" font-weight="400" fill="#898781" text-anchor="start">Thread names as in the code (threading.Thread names); figures from benchmarks/milestone9/m9_profile_*.json.</text></svg>
