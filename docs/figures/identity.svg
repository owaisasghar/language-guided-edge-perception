track window</text><rect x="430" y="286" width="340" height="78" rx="8" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/><rect x="430" y="296" width="4" height="58" rx="2" fill="#eb6834"/><text x="446" y="312" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">segment cam07/9~1</text><text x="446" y="332" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">camera, time span, phrase</text><text x="446" y="349" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">mean-centred embedding of ≤ 16 crops</text><line x1="368" y1="325" x2="426" y2="325" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="832" y="110" width="340" height="116" rx="8" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/><rect x="832" y="120" width="4" height="96" rx="2" fill="#1baf7a"/><text x="848" y="136" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">G-203: one vehicle, two cameras</text><text x="848" y="156" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">appearance similarity 0.71 ≥ threshold</text><text x="848" y="173" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">transit cam06 → cam07: 14 s (allowed)</text><text x="848" y="190" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">not in two places at once</text><text x="848" y="207" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">colour: white = white</text><rect x="832" y="286" width="340" height="78" rx="8" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/><rect x="832" y="296" width="4" height="58" rx="2" fill="#1baf7a"/><text x="848" y="312" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">G-207: new identity</text><text x="848" y="332" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">no candidate passes every rule</text><text x="848" y="349" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">("low evidence" until more 