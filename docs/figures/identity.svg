<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Identity model: local track IDs, tracklets and global identities"><title>Identity model: local track IDs, tracklets and global identities</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#fcfcfb"/><text x="28" y="34" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start">Identities: local IDs stay per camera; a global identity is a decision with recorded evidence</text><text x="28" y="70" font-size="11" font-weight="600" fill="#898781" text-anchor="start">PER CAMERA (TRACKER)</text><text x="430" y="70" font-size="11" font-weight="600" fill="#898781" text-anchor="start">TRACKLETS (RE-ID)</text><text x="832" y="70" font-size="11" font-weight="600" fill="#898781" text-anchor="start">GLOBAL IDENTITIES</text><rect x="28" y="86" width="340" height="78" rx="8" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/><rect x="28" y="96" width="4" height="58" rx="2" fill="#2a78d6"/><text x="44" y="112" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">cam06 · local ID 14</text><text x="44" y="132" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">box per frame, per phrase group</text><text x="44" y="149" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">ends after the lost-track window</text><rect x="430" y="86" width="340" height="78" rx="8" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/><rect x="430" y="96" width="4" height="58" rx="2" fill="#eb6834"/><text x="446" y="112" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">segment cam06/14~1</text><text x="446" y="132" font-size="12" font-weight="400" fi