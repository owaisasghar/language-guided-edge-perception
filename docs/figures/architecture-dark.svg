<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="System architecture of Language-Guided Multi-Camera Edge Perception"><title>System architecture of Language-Guided Multi-Camera Edge Perception</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#1a1a19"/><text x="24" y="34" font-size="16" font-weight="600" fill="#f0efec" text-anchor="start">Language-Guided Multi-Camera Edge Perception: one edge process on one 8 GB GPU</text><text x="28" y="70" font-size="11" font-weight="600" fill="#898781" text-anchor="start">VIDEO PATH · EVERY PROCESSED FRAME</text><rect x="24" y="80" width="232" height="92" rx="8" fill="#242422" stroke="#4a4a46" stroke-width="1"/><rect x="24" y="90" width="4" height="72" rx="2" fill="#3987e5"/><text x="40" y="106" font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">Cameras</text><text x="40" y="126" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">RTSP streams or video files</text><text x="40" y="143" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">1–8 streams, 1080p</text><rect x="274" y="80" width="232" height="92" rx="8" fill="#242422" stroke="#4a4a46" stroke-width="1"/><rect x="274" y="90" width="4" height="72" rx="2" fill="#3987e5"/><text x="290" y="106" font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">Ingestion</text><text x="290" y="126" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">capture thread per camera</text><text x="290" y="143" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">newest frame only, reconnects</text><rect x="524" y="80" width="232" height="92" rx="8" fill="#242422" stroke="#4a4a46" stroke-width="1"/><rect x="524" y="90" width="4" height="72" rx="2" fill="#3987e5"/><text x="540" y="106" font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">Scheduler</text><text x="540" y="126" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">frame sampling (e.g. 10 fps)</text><text x="540" y="143" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">batches across cameras</text><rect x="774" y="80" width="232" height="92" rx="8" fill="#242422" stroke="#4a4a46" stroke-width="1"/><rect x="774" y="90" width="4" height="72" rx="2" fill="#3987e5"/><text x="790" y="106" font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">Open-vocabulary detector</text><text x="790" y="126" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">YOLO-World-M, FP16</text><text x="790" y="143" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">prompt: "car . truck . person"</text><rect x="1024" y="80" width="232" height="92" rx="8" fill="#242422" stroke="#4a4a46" stroke-width="1"/><rect x="1024" y="90" width="4" height="72" rx="2" fill="#3987e5"/><text x="1040" y="106" font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">Per-camera tracking</text><text x="1040" y="126" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">ByteTrack / OC-SORT / BoT-SORT</text><text x="1040" y="143" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">local track IDs per camera</text><line x1="256" y1="126.0" x2="270" y2="126.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="506" y1="126.0" x2="520" y2="126.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="756" y1="126.0" x2="770" y2="126.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="1006" y1="126.0" x2="1020" y2="126.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="28" y="250" font-size="11" font-weight="600" fill="#898781" text-anchor="start">IDENTITY PATH · OWN THREAD, BOUNDED QUEUE</text><rect x="1024" y="260" width="232" height="92" rx="8" fill="#242422" stroke="#4a4a46" stroke-width="1"/><rect x="1024" y="270" width="4" height="72" rx="2" fill="#d95926"/><text x="1040" y="286" font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">Re-ID worker</text><text x="1040" y="306" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">sampled crops of each track</text><text x="1040" y="323" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">CLIP (+ FastReID) embeddings</text><rect x="774" y="260" width="232" height="92" rx="8" fill="#242422" stroke="#4a4a46" stroke-width="1"/><rect x="774" y="270" width="4" height="72" rx="2" fill="#d95926"/><text x="790" y="286" font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">Global identity manager</text><text x="790" y="306" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">appearance + time + camera</text><text x="790" y="323" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">layout + colour; logs evidence</text><rect x="524" y="260" width="232" height="92" rx="8" fill="#242422" stroke="#4a4a46" stroke-width="1"/><rect x="524" y="270" width="4" height="72" rx="2" fill="#d95926"/><text x="540" y="286" font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">Metadata store</text><text x="540" y="306" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">SQLite: tracks, trajectories,</text><text x="540" y="323" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">identities, events, embeddings</text><rect x="24" y="260" width="232" height="92" rx="8" fill="#242422" stroke="#4a4a46" stroke-width="1"/><text x="40" y="286" font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">Local ≠ global</text><text x="40" y="306" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">a local track ID is never a</text><text x="40" y="323" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">cross-camera identity</text><line x1="1140.0" y1="172" x2="1140.0" y2="256" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1148.0" y="220.0" font-size="11" font-weight="400" fill="#898781" text-anchor="start">tracks + crops</text><line x1="1024" y1="306.0" x2="1010" y2="306.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="774" y1="306.0" x2="760" y2="306.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="28" y="430" font-size="11" font-weight="600" fill="#898781" text-anchor="start">SERVING AND QUERIES</text><rect x="24" y="440" width="232" height="92" rx="8" fill="#242422" stroke="#4a4a46" stroke-width="1"/><rect x="24" y="450" width="4" height="72" rx="2" fill="#199e70"/><text x="40" y="466" font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">User</text><text x="40" y="486" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">"white SUV on cam07"</text><text x="40" y="503" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">"which cameras saw it?"</text><rect x="274" y="440" width="232" height="92" rx="8" fill="#242422" stroke="#4a4a46" stroke-width="1"/><rect x="274" y="450" width="4" height="72" rx="2" fill="#199e70"/><text x="290" y="466" font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">React dashboard</text><text x="290" y="486" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">Live · Search · Timeline</text><text x="290" y="503" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">System · identity journey</text><rect x="524" y="440" width="232" height="92" rx="8" fill="#242422" stroke="#4a4a46" stroke-width="1"/><rect x="524" y="450" width="4" height="72" rx="2" fill="#199e70"/><text x="540" y="466" font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">FastAPI server</text><text x="540" y="486" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">REST · Server-Sent Events</text><text x="540" y="503" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">live JPEG frames</text><rect x="774" y="440" width="232" height="92" rx="8" fill="#242422" stroke="#4a4a46" stroke-width="1"/><rect x="774" y="450" width="4" height="72" rx="2" fill="#199e70"/><text x="790" y="466" font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">Query parser</text><text x="790" y="486" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">categories, colours, types,</text><text x="790" y="503" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">clothing, cameras, time</text><rect x="1024" y="440" width="232" height="92" rx="8" fill="#242422" stroke="#4a4a46" stroke-width="1"/><rect x="1024" y="450" width="4" height="72" rx="2" fill="#199e70"/><text x="1040" y="466" font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">Search and checks</text><text x="1040" y="486" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">CLIP text vs track embeddings</text><text x="1040" y="503" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">+ colour and type checks</text><line x1="256" y1="486.0" x2="270" y2="486.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="506" y1="486.0" x2="520" y2="486.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="756" y1="486.0" x2="770" y2="486.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="1006" y1="486.0" x2="1020" y2="486.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="640.0" y1="352" x2="640.0" y2="436" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="648.0" y="400.0" font-size="11" font-weight="400" fill="#898781" text-anchor="start">tracks, identities, events</text><path d="M1140.0,532 V566 H390.0 V536" fill="none" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="765.0" y="560" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">ranked tracks · cameras that saw them · timeline</text><text x="28" y="626" font-size="12" font-weight="400" fill="#898781" text-anchor="start">Measured on an RTX 4060 Laptop GPU: 8 cameras × 10 fps, latency p50 42.6 ms (Milestone 8). Details: docs/architecture.md</text></svg>
