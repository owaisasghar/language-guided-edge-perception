# Milestone 1 sample images (COCO 2017 val).
#
# Selection method: filtered from COCO ground-truth annotations (NOT from detector output,
# to avoid selection bias), restricted to licences that allow derivatives (CC BY / CC BY-SA),
# then checked by eye for colour/attribute content. COCO has no colour attributes, so the
# `contents` notes are manual observations used for qualitative review only.
#
# Images are downloaded by scripts/download_samples.py and are never committed to Git.
# Attribution: see each image's flickr_url and licence when publishing derived images.
