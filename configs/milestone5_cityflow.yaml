# CityFlowV2 (AI City Challenge 2022 Track 1): multi-camera vehicle tracking, and CityFlow-NL crops.
#
#   python scripts/download_aicity.py cityflowv2 --accept-license --include ...   # see docs/milestone5.md
#   python scripts/process_aicity.py              # GPU, one pass per camera video: detect, track, embed
#   python scripts/eval_aicity_mtmc.py            # CPU: cross-camera association + official evaluation
#   python scripts/eval_cityflow_nl.py            # CPU/GPU: natural-language track retrieval (Milestone 6)
#
# Protocol: nothing is trained. Association settings are tuned on the train scenarios (S01, S03, S04) with the
# official evaluator and the train ground truth; results are reported on the validation scenarios (S02, S05).
# Transit-time windows between cameras are estimated from the train ground truth (S05 reuses cameras of S03
# and S04, so those windows carry over; camera pairs never seen in train use the default window).

extends: milestone5_reid.yaml   # CLIP embedder, crop sampling, association defaults, detector presets

run_name: m5_cityflow
output_dir: outputs/milestone5
benchmark_dir: benchmarks/milestone5

aicity:
  root: data/aicity/cityflowv2
  cache_dir: outputs/milestone5/aicity       # per-camera results of process_aicity.py
  fps: {default: 10, c015: 8}                # from the dataset's ReadMe
  train_scenarios: [S01, S03, S04]
  validation_scenarios: [S02, S05]
  detector: yoloworld_m_vehicles
  prompt: car . truck . bus                  # tracked as one class ("vehicle"): car/truck labels flicker
  roi_filter: true                           # drop detections whose centre is outside the camera's ROI mask
  association:
    member_reduction: max
    max_gap_same_camera_s: 10.0              # Milestone 5 value
    min_samples: 2                           # tracklets with fewer CLIP samples are never linked
  # generic time rule (variant "time", and camera pairs never seen in train): any transit of 0-300 s, and
  # the same vehicle may be in two cameras at once (overlapping views are common in CityFlow)
  default_transit: {min_s: 0.0, max_s: 300.0, overlapping: true}
  transit_margin_s: 10.0                     # widen each learned window by this much on both sides
  colour_template: "a photo of a {colour} vehicle."
  tune_thresholds: [0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9]
  tune_attribute_overlaps: [0.3, 0.5, 0.7]

nl:
  root: data/aicity/cityflow_nl
  crops_per_track: 4                         # evenly spaced frames of each annotated track

tracker:                                     # vehicles at 10 fps; no pedestrian aspect filter
  track_thresh: 0.3
  track_buffer: 30
  match_thresh: 0.8
  mot20: false
  min_box_area: 400
  max_aspect_ratio: null

reid:
  sampling:
    min_height_px: 40
    min_score: 0.3
    border_margin_px: 4
    max_occlusion: 0.3
    every_n_frames: 5
    max_samples: 16
    center: true

models:
  yoloworld_m_vehicles:
    backend: ultralytics_yolo_world
    weights: models/yolo_world/yolov8m-worldv2.pt
    dtype: float32
    imgsz: 640
    conf: 0.05
    iou: 0.7
    max_det: 300
    multi_label: false
    letterbox: minimal
