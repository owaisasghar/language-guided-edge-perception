# Vehicle mode: track cars, trucks, buses and motorcycles; search them by colour, type and description.
#
#   python scripts/serve.py --config configs/vehicles.yaml        # the 4 CityFlowV2 cameras below; open :8000
#   python scripts/eval_vehicle_attributes.py                      # how well colour + type checks find vehicles
#
# Cameras: the four cameras of CityFlowV2 scenario S02 (one intersection, overlapping views), read as video
# files at their real speed (10 fps) and looped. Needs the AI City data (docs/milestone5.md) and its licence:
# non-commercial research only; never show unblurred plates or faces from it in public (no screenshots).
# Replace `cameras:` with your own RTSP cameras for real use.
#
# Settings from the CityFlowV2 work of Milestone 5 (detector threshold, tracking as one "vehicle" class,
# crop sampling and the association threshold tuned on its train scenarios); optimisations from Milestone 8.

extends: milestone8_scaling.yaml

run_name: vehicles
output_dir: outputs/vehicles
benchmark_dir: benchmarks/vehicles

pipeline:
  prompt: car . truck . bus . motorcycle
  process_fps: 10
  batch_size: 4
  tracker:
    track_thresh: 0.3                       # Milestone 5, CityFlowV2 (with match_thresh and min_box_area)
    match_thresh: 0.8
    min_box_area: 400
    max_aspect_ratio: null                  # no pedestrian shape filter
    phrase_groups: {vehicle: [car, truck, bus, motorcycle]}   # labels flicker; track them as one class

reid_overrides:
  sampling: {min_height_px: 40, min_score: 0.3, border_margin_px: 4, max_occlusion: 0.3, every_n_frames: 5,
             max_samples: 16, center: true}
  association: {appearance_threshold: 0.55, member_reduction: max, use_time: true, use_phrase: true,
                max_gap_same_camera_s: 10, min_samples: 2}
  topology:
    default: {min_s: 0, max_s: 300, overlapping: true}

store:
  path: outputs/vehicles/lgep.sqlite

camera_defaults:
  loop: true          # video files: start again at the end
  realtime: true      # ... and read them at their own frame rate, like a live camera

cameras:
  - {camera_id: cam06, url: data/aicity/cityflowv2/validation/S02/c006/vdo.avi, extra: {source: CityFlowV2 S02 c006}}
  - {camera_id: cam07, url: data/aicity/cityflowv2/validation/S02/c007/vdo.avi, extra: {source: CityFlowV2 S02 c007}}
  - {camera_id: cam08, url: data/aicity/cityflowv2/validation/S02/c008/vdo.avi, extra: {source: CityFlowV2 S02 c008}}
  - {camera_id: cam09, url: data/aicity/cityflowv2/validation/S02/c009/vdo.avi, extra: {source: CityFlowV2 S02 c009}}
simulation:
  cameras: []

query_weights:        # search scoring: description similarity x 4 (Milestone 6) + colour/type checks x 0.5
  attributes: 0.5     # tuned on CityFlow-NL S02 with the vehicle-type check (benchmarks/vehicles/vehicle_attributes.md)

query_examples:       # shown as suggestions in the dashboard's search
  - white SUV
  - red car
  - black pickup truck
  - silver sedan on cam07
  - blue van in the last 5 minutes
