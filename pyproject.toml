[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lgep"
version = "0.1.0"
description = "Language-Guided Multi-Camera Edge Perception: open-vocabulary detection, tracking and cross-camera retrieval."
readme = "README.md"
requires-python = ">=3.10"  # 3.10 kept for Jetson (JetPack 6 ships Python 3.10)
# torch / torchvision are intentionally NOT listed: they must be installed from the
# PyTorch index matching your CUDA driver (see docs/installation.md).
dependencies = [
    "transformers>=5.0,<6",
    "huggingface-hub>=1.0",
    "pillow>=10.1",
    "numpy>=1.26",
    "pyyaml>=6.0",
    # Tracking (Milestone 3): ByteTrack's Kalman filter (scipy) and assignment solver (lap), both BSD.
    "scipy>=1.13",
    "lap>=0.5.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# YOLO-World backend (Milestone 2). AGPL-3.0: kept optional so the core package stays licence-neutral.
# The CLIP fork is the one Ultralytics would otherwise pip-install at runtime; pinned to a commit here.
yolo = [
    "ultralytics==8.4.211",
    "clip @ git+https://github.com/ultralytics/CLIP.git@7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40",
]
# Evaluation: COCO detection metrics (M2) and the official TrackEval for HOTA / IDF1 / MOTA (M3), pinned to
# a commit because TrackEval has no official PyPI release (the PyPI "trackeval" is a third-party fork).
eval = [
    "pycocotools>=2.0.8",
    "trackeval @ git+https://github.com/JonathonLuiten/TrackEval.git@12c8791b303e0a0b50f753af204249e622d0281a",
]
# Video and camera input/output (OpenCV with FFmpeg): scripts/track_video.py (M3) and RTSP ingestion (M4),
# which uses CAP_PROP_N_THREADS and the open/read timeouts. Tested with opencv-python 5.0.0.93.
video = ["opencv-python>=4.10"]
# HTTP API and dashboard server (Milestone 7). Tested with fastapi 0.162.5, uvicorn 0.54.0 (pydantic 2.14).
server = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
# Dedicated Re-ID models (Milestone 9): what the official FastReID code (a local checkout at third_party/fast-reid,
# commit c9bc3ce, Apache-2.0; see docs/milestone9.md) imports for building its models.
fastreid = ["yacs==0.1.8", "termcolor==2.5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a working CUDA device",
    "weights: needs model weights in the local Hugging Face cache",
]
addopts = "-ra"
