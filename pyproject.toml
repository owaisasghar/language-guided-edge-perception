[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lgep"
version = "0.1.0"
description = "Language-Guided Multi-Camera Edge Perception: open-vocabulary detection, tracking and cross-camera retrieval."
readme = "README.md"
requires-python = ">=3.10"  # 3.10 kept for Jetson (JetPack 6 ships Python 3.10)
# torch / torchvision are intentionally NOT listed: they must be installed from the
# PyTorch index matching your CUDA driver (see docs/installation.md).
dependencies = [
    "transformers>=5.0,<6",
    "huggingface-hub>=1.0",
    "pillow>=10.1",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# YOLO-World backend (Milestone 2). AGPL-3.0: kept optional so the core package stays licence-neutral.
# The CLIP fork is the one Ultralytics would otherwise pip-install at runtime; pinned to a commit here.
yolo = [
    "ultralytics==8.4.211",
    "clip @ git+https://github.com/ultralytics/CLIP.git@7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40",
]
eval = ["pycocotools>=2.0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a working CUDA device",
    "weights: needs model weights in the local Hugging Face cache",
]
addopts = "-ra"
